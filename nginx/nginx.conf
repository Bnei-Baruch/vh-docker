# Main nginx configuration.
#
# This replaces Rocky 9's stock /etc/nginx/nginx.conf. The only substantive
# difference is that the stock file embeds a `server { listen 80 default_server; }`
# block serving the nginx welcome page. That block collides with the
# `default_server` in sites/*.conf — nginx refuses to start with "duplicate
# default server" — and leaving ours out instead would mean unknown Host headers
# get the welcome page rather than a 404. Owning this file is simpler than
# patching theirs in place.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # $remote_addr above is the real client IP only because conf.d/10-realip.conf
    # rewrites it from X-Forwarded-For. These logs are shipped to Loki by the
    # Grafana Agent, so getting that wrong is not recoverable after the fact.

    access_log /var/log/nginx/access.log main;

    # TLS terminates at the edge LB; nginx itself only ever speaks plain HTTP
    # (see sites/*.conf). If a proxied backend issues a relative redirect (e.g.
    # Gin's RedirectTrailingSlash) and nginx is left to absolutize it, it does so
    # using its own scheme — http — handing the browser an explicit downgrade on
    # an https:// site (mixed-content block). Relative stays relative here, so
    # the browser resolves it against the scheme it actually used.
    absolute_redirect off;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 00-upstreams.conf, 10-realip.conf, 50-vh.conf
    include /etc/nginx/conf.d/*.conf;
}
