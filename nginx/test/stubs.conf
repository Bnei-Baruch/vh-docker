# Stub backends for run.sh — each echoes the URI it actually received, so the
# test can assert on prefix stripping rather than just on "did it 200".
# Ports mirror nginx/conf.d/00-upstreams.conf.
#
# Each also reflects the X-Real-IP it was handed back as a response header, so
# the test can assert what the backend would actually record as the client —
# that is the value real_ip + proxy.conf exist to get right.

server { listen 127.0.0.1:8081; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-front:$request_uri\n"; } }
server { listen 127.0.0.1:8080; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-dash:$request_uri\n"; } }
server { listen 127.0.0.1:8084; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-payment:$request_uri\n"; } }
server { listen 127.0.0.1:8087; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-payment-bo:$request_uri\n"; } }
server { listen 127.0.0.1:8089; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-events-bo:$request_uri\n"; } }
server { listen 127.0.0.1:8185; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-srv-orders:$request_uri\n"; } }
server { listen 127.0.0.1:7471; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-srv-profile:$request_uri\n"; } }
server { listen 127.0.0.1:7475; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-srv-events:$request_uri\n"; } }
server { listen 127.0.0.1:8190; location / { add_header X-Seen-Real-IP $http_x_real_ip always; default_type text/plain; return 200 "vh-srv-accounting:$request_uri\n"; } }
