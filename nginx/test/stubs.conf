# Stub backends for run.sh — each echoes the URI it actually received, so the
# test can assert on prefix stripping rather than just on "did it 200".
# Ports mirror nginx/conf.d/00-upstreams.conf.

server { listen 127.0.0.1:8081; location / { default_type text/plain; return 200 "vh-front:$request_uri\n"; } }
server { listen 127.0.0.1:8080; location / { default_type text/plain; return 200 "vh-dash:$request_uri\n"; } }
server { listen 127.0.0.1:8084; location / { default_type text/plain; return 200 "vh-payment:$request_uri\n"; } }
server { listen 127.0.0.1:8087; location / { default_type text/plain; return 200 "vh-payment-bo:$request_uri\n"; } }
server { listen 127.0.0.1:8089; location / { default_type text/plain; return 200 "vh-events-bo:$request_uri\n"; } }
server { listen 127.0.0.1:8185; location / { default_type text/plain; return 200 "vh-srv-orders:$request_uri\n"; } }
server { listen 127.0.0.1:7471; location / { default_type text/plain; return 200 "vh-srv-profile:$request_uri\n"; } }
server { listen 127.0.0.1:7475; location / { default_type text/plain; return 200 "vh-srv-events:$request_uri\n"; } }
server { listen 127.0.0.1:8190; location / { default_type text/plain; return 200 "vh-srv-accounting:$request_uri\n"; } }
