# Production ingress — kli.one / api.kli.one (+ the *-vh aliases used for
# Phase-2 validation before the traffic flip).
#
# TLS is terminated at the edge LB; this host only ever speaks plain HTTP on :80.
# No certbot, no ssl_certificate directives.
#
# Path routing replaces Kong. Every Kong route was strip_path=true, which the
# trailing slash on proxy_pass reproduces exactly: /events/foo -> upstream /foo.
# Removing that slash would forward /events/foo and 404 everything.

# ------------------------------------------------------------------- web -----
server {
    listen 80;
    server_name kli.one production-vh.kli.one;

    rewrite_log on;

    location ^~ / {
        proxy_pass http://vh-front/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /dash {
        proxy_pass http://vh-dash/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /pay {
        proxy_pass http://vh-payment/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/payments {
        proxy_pass http://vh-payment-bo/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/events {
        proxy_pass http://vh-events-bo/;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Retired with this migration — vh-registration and vh-admin-users are not
    # deployed on-prem. /register and /admin/users fall through to vh-front's
    # SPA above; confirmed unused.
}

# ------------------------------------------------------------------- api -----
server {
    listen 80;
    server_name api.kli.one production-vh-api.kli.one;

    rewrite_log on;

    location ^~ /pay {
        proxy_pass http://vh-srv-orders/;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /profile {
        proxy_pass http://vh-srv-profile/;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /events {
        proxy_pass http://vh-srv-events/;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /accounting {
        proxy_pass http://vh-srv-accounting/;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    # Retired Kong routes: /register (vh-srv-registration), /srvtest, /survey,
    # /kc (vh-srv-keycloak). Not deployed on-prem — these 404 by design.
    location / {
        return 404;
    }
}

# Anything arriving with an unexpected Host. The old production host had no
# server_name at all on :80, so it answered to everything; being explicit here
# means a misconfigured LB backend fails loudly instead of silently serving the
# wrong site.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
