# Production ingress — kli.one / api.kli.one (+ the *-vh aliases used for
# Phase-2 validation before the traffic flip).
#
# TLS is terminated at the edge LB; this host only ever speaks plain HTTP on :80.
# No certbot, no ssl_certificate directives.
#
# Path routing replaces Kong. Every Kong route was strip_path=true, so the prefix
# must be removed before the request reaches the upstream.
#
# The obvious spelling — `proxy_pass http://upstream/;` with a trailing slash —
# is subtly wrong here. nginx substitutes the matched prefix with "/", so
# `location ^~ /pay` turns /pay/v1/orders into //v1/orders, with a doubled
# slash. Static frontends normalise that away (which is why the current Scaleway
# config gets away with it), but Go routers generally do not, and Kong produced
# a clean /v1/orders. The explicit rewrite below reproduces Kong exactly:
#   /pay -> /   ·   /pay/ -> /   ·   /pay/v1/orders -> /v1/orders
#
# proxy_redirect on each api location: the Go backends (Gin) redirect to add a
# missing trailing slash, e.g. POST /v2/transaction -> 307 Location:
# /v2/transaction/. That Location is relative to whatever path the backend
# thinks it's serving — which, after the rewrite above strips /pay, no longer
# includes it. Left alone, the browser follows the redirect to
# api.kli.one/v2/transaction/, which falls through to the 404 catch-all below
# and never gets a CORS header, breaking the preflight on the follow-up
# request. Kong masked this by adding CORS globally; nginx's CORS is scoped
# per-location, so the prefix has to be restored before the redirect leaves.

# ------------------------------------------------------------------- web -----
server {
    listen 80;
    server_name kli.one production-vh.kli.one;

    rewrite_log on;

    location ^~ / {
        proxy_pass http://vh-front/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /dash {
        rewrite ^/dash/?(.*)$ /$1 break;
        proxy_pass http://vh-dash;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /pay {
        rewrite ^/pay/?(.*)$ /$1 break;
        proxy_pass http://vh-payment;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/payments {
        rewrite ^/admin/payments/?(.*)$ /$1 break;
        proxy_pass http://vh-payment-bo;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/events {
        rewrite ^/admin/events/?(.*)$ /$1 break;
        proxy_pass http://vh-events-bo;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Retired with this migration — vh-registration and vh-admin-users are not
    # deployed on-prem. /register and /admin/users fall through to vh-front's
    # SPA above; confirmed unused.
}

# ------------------------------------------------------------------- api -----
server {
    listen 80;
    server_name api.kli.one production-vh-api.kli.one;

    rewrite_log on;

    location ^~ /pay {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/pay/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-orders;
        proxy_redirect http://vh-srv-orders/ /pay/;
        proxy_redirect / /pay/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /profile {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/profile/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-profile;
        proxy_redirect http://vh-srv-profile/ /profile/;
        proxy_redirect / /profile/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /events {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/events/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-events;
        proxy_redirect http://vh-srv-events/ /events/;
        proxy_redirect / /events/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /accounting {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/accounting/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-accounting;
        proxy_redirect http://vh-srv-accounting/ /accounting/;
        proxy_redirect / /accounting/;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Retired Kong routes: /register (vh-srv-registration), /srvtest, /survey,
    # /kc (vh-srv-keycloak). Not deployed on-prem — these 404 by design.
    location / {
        return 404;
    }
}

# Anything arriving with an unexpected Host. The old production host had no
# server_name at all on :80, so it answered to everything; being explicit here
# means a misconfigured LB backend fails loudly instead of silently serving the
# wrong site.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
