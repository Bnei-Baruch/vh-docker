# Staging ingress — staging-vh.kli.one / staging-vh-api.kli.one.
#
# Mirrors production.conf exactly; the point of staging is to exercise the same
# routing. eurokab.info is retired and deliberately absent.
#
# See production.conf for why prefix stripping uses an explicit `rewrite` rather
# than a trailing slash on proxy_pass.
#
# TLS terminates at the edge LB; plain HTTP on :80 here.

# ------------------------------------------------------------------- web -----
server {
    listen 80;
    server_name staging-vh.kli.one;

    rewrite_log on;

    location ^~ / {
        proxy_pass http://vh-front/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /dash {
        rewrite ^/dash/?(.*)$ /$1 break;
        proxy_pass http://vh-dash;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /pay {
        rewrite ^/pay/?(.*)$ /$1 break;
        proxy_pass http://vh-payment;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/payments {
        rewrite ^/admin/payments/?(.*)$ /$1 break;
        proxy_pass http://vh-payment-bo;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /admin/events {
        rewrite ^/admin/events/?(.*)$ /$1 break;
        proxy_pass http://vh-events-bo;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Retired staging-only apps: /help (vh-help), /form (vh-survey),
    # /complete (vh-profile-completion), /register, /admin/users.
    # Not deployed on-prem — confirmed unused.
}

# ------------------------------------------------------------------- api -----
server {
    listen 80;
    server_name staging-vh-api.kli.one;

    rewrite_log on;

    location ^~ /pay {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/pay/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-orders;
        proxy_redirect http://vh-srv-orders/ /pay/;
        proxy_redirect / /pay/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /profile {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/profile/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-profile;
        proxy_redirect http://vh-srv-profile/ /profile/;
        proxy_redirect / /profile/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /events {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/events/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-events;
        proxy_redirect http://vh-srv-events/ /events/;
        proxy_redirect / /events/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /accounting {
        include /etc/nginx/snippets/cors.conf;
        rewrite ^/accounting/?(.*)$ /$1 break;
        proxy_pass http://vh-srv-accounting;
        proxy_redirect http://vh-srv-accounting/ /accounting/;
        proxy_redirect / /accounting/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
