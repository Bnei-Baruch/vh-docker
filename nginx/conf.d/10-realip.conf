# Real client IP recovery behind the edge load balancer.
#
# The LB terminates TLS and forwards plain HTTP to this host on :80, so without
# this block every request appears to come from the LB. That would put the LB's
# address into the payment audit trail, Sentry events and the nginx access logs
# the Grafana Agent ships to Loki — silently, and unrecoverably after the fact.
#
# We trust the private ranges rather than a single LB address. The VMs sit on
# 10.0.0.0/8 behind the LB, nothing outside that range can reach :80, and this
# way the file needs no per-host edit and does not go stale if the LB is
# re-addressed or a second one is added.
#
# The trade-off: any host already inside the private network can forge
# X-Forwarded-For and choose the IP that lands in the audit trail. That is
# acceptable here — reaching :80 at all already requires being inside — but it
# is the reason not to widen this further.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from fd00::/8;
real_ip_header   X-Forwarded-For;

# Walk the X-Forwarded-For chain right-to-left past every trusted hop, so the
# real client is found even if a second proxy is added in front later.
real_ip_recursive on;
