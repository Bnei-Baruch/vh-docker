# Upstreams — host-published container ports.
#
# nginx runs on the HOST, not in the vh docker network, so it addresses services
# by their published 127.0.0.1 port. This is why the ports below are the LEFT
# side of each service's compose `ports:` mapping.
#
# Kong used to reach these by container name over the vh network, which is why
# its service table lists vh-srv-events:8080 while nginx must use 127.0.0.1:7475.
# Do not "fix" the events port to 8080 — that is the container-side port.

# --- Web (static frontends) ---
upstream vh-front      { server 127.0.0.1:8081; }   # compose 8081:80
upstream vh-dash       { server 127.0.0.1:8080; }   # compose 8080:80
upstream vh-payment    { server 127.0.0.1:8084; }   # compose 8084:80
upstream vh-payment-bo { server 127.0.0.1:8087; }   # compose 8087:80
upstream vh-events-bo  { server 127.0.0.1:8089; }   # compose 8089:80

# --- API (backends; replaces Kong's service table) ---
upstream vh-srv-orders     { server 127.0.0.1:8185; }   # compose 8185:8185
upstream vh-srv-profile    { server 127.0.0.1:7471; }   # compose 7471:7471
upstream vh-srv-events     { server 127.0.0.1:7475; }   # compose 7475:8080  <-- host port is 7475
upstream vh-srv-accounting { server 127.0.0.1:8190; }   # compose 8190:8190

# Scraped by nginx-exporter in the monitoring stack.
server {
    listen 127.0.0.1:8079;
    server_name localhost;

    keepalive_timeout 0;
    access_log off;

    allow 127.0.0.1;
    deny all;

    location /nginx_status {
        stub_status;
    }
}
