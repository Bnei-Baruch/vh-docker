# Shared proxy headers. Carried over verbatim from the current Scaleway hosts,
# with two additions for the new topology.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $server_name;

# NEW: the edge LB terminates TLS, so without this the apps see plain http and
# any absolute URL they build (redirects, Keycloak callbacks, payment returns)
# comes out as http:// on an https:// site.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

include /etc/nginx/mime.types;
