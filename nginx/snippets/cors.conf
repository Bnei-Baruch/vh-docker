# CORS for the API hosts.
#
# Derived from the api.kli.one server block on the current Scaleway production
# host. That block sat in nginx *in front of* Kong, not inside Kong, so removing
# Kong does not remove the requirement — without this, browser calls from the
# frontends fail preflight.
#
# ⚠ INCLUDE THIS BEFORE THE `rewrite` IN EACH LOCATION.
#   Both `rewrite` and `if` belong to ngx_http_rewrite_module and run in the same
#   phase, in order. A `rewrite ... break` earlier in the location terminates that
#   phase, so an `if` placed after it never executes and CORS silently vanishes —
#   preflights return the upstream's 200 with no Access-Control headers at all.
#
# Wildcard origin is carried over from the current config unchanged. Tightening
# it is a separate decision, not part of the migration.

# Applied to every response from this location. The original spelled this as
# `if ($request_method ~* "(GET|POST|PATCH|DELETE)")`, which merely excluded
# HEAD and PUT from getting the headers; doing it unconditionally is simpler and
# strictly more permissive in the same direction.
add_header 'Access-Control-Allow-Origin'      '*' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS, DELETE, PATCH' always;
add_header 'Access-Control-Allow-Headers'     'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;

# Preflight is answered here and never reaches the backend.
# add_header inside an `if` REPLACES the set above rather than adding to it, so
# the full list has to be repeated — same as the original config did.
if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin'      '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers'     'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
    add_header 'Access-Control-Max-Age'           1728000;
    add_header 'Content-Type'                     'text/plain charset=UTF-8';
    add_header 'Content-Length'                   0;
    return 204;
}
